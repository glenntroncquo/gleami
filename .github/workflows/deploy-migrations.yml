name: Deploy Migrations

on:
  push:
    branches:
      - main
    paths:
      - "backend/supabase/supabase/migrations/**"
      - ".github/workflows/deploy-migrations.yml"
  workflow_dispatch:

concurrency:
  group: deploy-migrations-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "Missing secret SUPABASE_DB_PASSWORD"
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "Missing secret or variable SUPABASE_PROJECT_ID"
            exit 1
          fi

          supabase link --project-ref "$SUPABASE_PROJECT_ID" --yes
          supabase db push --linked --yes
