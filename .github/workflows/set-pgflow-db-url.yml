name: Set pgflow database URL

on:
  workflow_dispatch:

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Set EDGE_WORKER_DB_URL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import os, urllib.parse, subprocess
          password = os.environ["SUPABASE_DB_PASSWORD"]
          encoded = urllib.parse.quote(password, safe="")
          url = (
            "postgresql://postgres.kvhinnhnwgvdpzggdnxs:"
            f"{encoded}@aws-0-eu-central-1.pooler.supabase.com:6543/postgres"
          )
          result = subprocess.run(
            [
              "supabase",
              "secrets",
              "set",
              "--project-ref",
              "kvhinnhnwgvdpzggdnxs",
              f"EDGE_WORKER_DB_URL={url}",
            ],
            text=True,
            capture_output=True,
          )
          out = ((result.stdout or "") + (result.stderr or "")).replace(password, "[redacted]").replace(encoded, "[redacted]")
          print(out)
          if result.returncode != 0:
            raise SystemExit(result.returncode)
          print("EDGE_WORKER_DB_URL set")
          PY
